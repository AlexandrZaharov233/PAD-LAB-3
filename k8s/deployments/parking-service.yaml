apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-service
  labels:
    app.kubernetes.io/part-of: parkslot
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 240
  selector:
    matchLabels:
      app: parking-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: parking-service
        app.kubernetes.io/part-of: parkslot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: parking-service
        image: parkslot/parking-service:lab3
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: parkslot-runtime
        - secretRef:
            name: parkslot-shared
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /data
      initContainers:
      - name: prepare-data
        image: parkslot/parking-service:lab3
        imagePullPolicy: Never
        command:
        - /bin/sh
        - -ec
        - chown 10001:10001 /data && chmod 0750 /data
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: parking-data

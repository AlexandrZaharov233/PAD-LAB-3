apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/part-of: parkslot
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 240
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/part-of: parkslot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: gateway
        image: parkslot/gateway:lab3
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: parkslot-runtime
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 30m
            memory: 64Mi
          limits:
            cpu: 400m
            memory: 192Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: PARKSLOT_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: parkslot-shared
              key: JWT_PUBLIC_KEY
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: parkslot-shared
              key: INTERNAL_API_KEY

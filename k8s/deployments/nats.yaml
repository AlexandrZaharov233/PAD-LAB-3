apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    app.kubernetes.io/part-of: parkslot
spec:
  replicas: 1
  serviceName: nats-headless
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
        app.kubernetes.io/part-of: parkslot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: nats
        image: nats:2.11.8-alpine
        imagePullPolicy: IfNotPresent
        args:
        - nats-server
        - -c
        - /etc/parkslot/nats.conf
        ports:
        - name: client
          containerPort: 4222
        - name: monitor
          containerPort: 8222
        envFrom:
        - configMapRef:
            name: parkslot-runtime
        env:
        - name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: parkslot-shared
              key: NATS_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 40m
            memory: 64Mi
          limits:
            cpu: 400m
            memory: 192Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: monitor
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: monitor
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz?js-enabled-only=true
            port: monitor
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/parkslot
          readOnly: true
      initContainers:
      - name: prepare-data
        image: nats:2.11.8-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - chown 10001:10001 /data && chmod 0750 /data
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nats-data
      - name: config
        configMap:
          name: parkslot-nats

apiVersion: v1
kind: ConfigMap
metadata:
  name: parkslot-nats
  labels:
    app.kubernetes.io/part-of: parkslot
data:
  nats.conf: "port: 4222\nhttp_port: 8222\nserver_name: parking-local\nauthorization {\n  user: $NATS_USER\n  password:\
    \ $NATS_PASSWORD\n}\njetstream {\n  store_dir: /data/jetstream\n  max_memory_store: 64MB\n  max_file_store:\
    \ 256MB\n}\n"

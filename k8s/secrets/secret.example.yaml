# Template for explanation only. start-k8s creates both Secrets at runtime.
apiVersion: v1
kind: Secret
metadata:
  name: parkslot-shared
  namespace: parkslot
type: Opaque
stringData:
  JWT_PUBLIC_KEY: "<generated Ed25519 public key, as base64 PEM>"
  INTERNAL_API_KEY: "<generated service authentication key>"
  NATS_PASSWORD: "<generated broker password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: parkslot-auth
  namespace: parkslot
type: Opaque
stringData:
  JWT_PRIVATE_KEY: "<generated Ed25519 private key, as base64 PEM>"
  ADMIN_PASSWORD: "<generated administrator password>"

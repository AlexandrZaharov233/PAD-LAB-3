name: ParkSlot tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unit:
    name: Python unit tests and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - run: python scripts/ci_test_runner.py --output .local/ci-unit tests/test_services.py tests/test_gateway.py tests/test_expansion.py tests/test_ci_reports.py
      - run: python -m pip install PyYAML
      - run: python scripts/validate-lab3.py
      - run: node --check gateway/web/app.js && node --check gateway/web/features.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: .local/ci-unit/
          include-hidden-files: true
          if-no-files-found: ignore

  compose:
    name: Docker Compose and all tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install cryptography==50.0.2
      - run: python scripts/configure.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 240
      - name: Run complete test suite
        run: |
          mkdir -p .local/ci-compose
          chmod 0777 .local/ci-compose
          docker compose --profile test run --build --rm \
            --volume "$PWD/.local/ci-compose:/results" \
            --entrypoint python tests /app/scripts/ci_test_runner.py --output /results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-results
          path: .local/ci-compose/
          include-hidden-files: true
          if-no-files-found: ignore
      - if: always()
        run: docker compose down

  kubernetes:
    name: Minikube deployment and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Install Minikube
        run: |
          curl -fsSL --retry 3 https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64 -o "$RUNNER_TEMP/minikube"
          curl -fsSL --retry 3 https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64.sha256 -o "$RUNNER_TEMP/minikube.sha256"
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/minikube.sha256")" "$RUNNER_TEMP/minikube" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/minikube" /usr/local/bin/minikube
      - name: Create local cluster
        run: minikube -p parkslot-lab3 start --driver=docker --container-runtime=docker --cpus=2 --memory=4096
      - name: Deploy ParkSlot
        run: |
          set -euo pipefail
          private_dir="$(mktemp -d)"
          trap 'rm -rf "$private_dir"' EXIT
          python scripts/configure.py "$private_dir/secrets.env" --k8s-only
          grep -E '^(JWT_PUBLIC_KEY|INTERNAL_API_KEY|NATS_PASSWORD)=' "$private_dir/secrets.env" > "$private_dir/shared.env"
          grep -E '^(JWT_PRIVATE_KEY|ADMIN_PASSWORD)=' "$private_dir/secrets.env" > "$private_dir/auth.env"
          kubectl --context parkslot-lab3 apply -f k8s/namespace.yaml
          kubectl --context parkslot-lab3 -n parkslot create secret generic parkslot-shared --from-env-file="$private_dir/shared.env"
          kubectl --context parkslot-lab3 -n parkslot create secret generic parkslot-auth --from-env-file="$private_dir/auth.env"
          docker compose build $(docker compose config --services | sed '/^nats$/d;/^tests$/d')
          for service in $(docker compose config --services | sed '/^nats$/d;/^tests$/d'); do
            minikube -p parkslot-lab3 image load --daemon "parkslot/$service:lab3"
          done
          kubectl --context parkslot-lab3 -n parkslot apply -k k8s --dry-run=server
          kubectl --context parkslot-lab3 -n parkslot apply -k k8s
          kubectl --context parkslot-lab3 -n parkslot rollout status deployment/gateway --timeout=300s
      - name: Test live API and Gateway scaling
        run: |
          set -euo pipefail
          k() { kubectl --context parkslot-lab3 -n parkslot "$@"; }
          k port-forward --address 127.0.0.1 service/gateway 8082:8000 > "$RUNNER_TEMP/parkslot-port.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8082/ready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8082/ready >/dev/null
          export RUN_E2E=1 E2E_URL=http://127.0.0.1:8082 E2E_ADMIN_EMAIL=admin@parking.local
          E2E_ADMIN_PASSWORD="$(k get secret parkslot-auth -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d)"
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          export E2E_ADMIN_PASSWORD
          python scripts/ci_test_runner.py --output .local/ci-kubernetes tests/test_e2e.py
          k scale deployment/gateway --replicas=3
          k rollout status deployment/gateway --timeout=180s
          printf '%s\n' 'from urllib.request import urlopen; from collections import Counter; s=Counter(urlopen("http://gateway:8000/health",timeout=5).headers["X-ParkSlot-Instance"] for i in range(96)); print(dict(s)); assert len(s)==3, s' |
            k exec -i deployment/gateway -- python -
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-test-results
          path: .local/ci-kubernetes/
          include-hidden-files: true
          if-no-files-found: ignore
      - if: failure()
        run: kubectl --context parkslot-lab3 -n parkslot get pods,services,pvc,events
      - if: always()
        run: minikube -p parkslot-lab3 delete
